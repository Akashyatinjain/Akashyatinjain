<svg width="900" height="330" viewBox="0 0 900 330" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="rounded2">
      <rect x="0" y="0" width="900" height="330" rx="10" ry="10"/>
    </clipPath>
  </defs>

  <g clip-path="url(#rounded2)">
    <rect width="900" height="330" fill="#0d1117"/>

    <!-- title bar -->
    <rect x="0" y="0" width="900" height="34" fill="#161b22"/>
    <circle cx="20" cy="17" r="6" fill="#ff5f56"/>
    <circle cx="42" cy="17" r="6" fill="#ffbd2e"/>
    <circle cx="64" cy="17" r="6" fill="#27c93f"/>
    <text x="450" y="21" font-family="SFMono-Regular, Consolas, monospace" font-size="12" fill="#8b949e" text-anchor="middle">git log --stats --author=akash</text>

    <g font-family="SFMono-Regular, Consolas, monospace" fill="#c9d1d9">

      <!-- left column: core stats -->
      <text x="30" y="70" font-size="16" fill="#7ee787">stars_earned</text>
      <text x="260" y="70" font-size="16" text-anchor="end" fill="#ffffff">8</text>

      <text x="30" y="100" font-size="16" fill="#7ee787">commits_last_year</text>
      <text x="260" y="100" font-size="16" text-anchor="end" fill="#ffffff">744</text>

      <text x="30" y="130" font-size="16" fill="#7ee787">total_prs</text>
      <text x="260" y="130" font-size="16" text-anchor="end" fill="#ffffff">0</text>

      <text x="30" y="160" font-size="16" fill="#7ee787">total_issues</text>
      <text x="260" y="160" font-size="16" text-anchor="end" fill="#ffffff">0</text>

      <text x="30" y="190" font-size="16" fill="#7ee787">contributed_to</text>
      <text x="260" y="190" font-size="16" text-anchor="end" fill="#ffffff">1</text>

      <!-- divider -->
      <line x1="300" y1="50" x2="300" y2="220" stroke="#30363d" stroke-width="1"/>

      <!-- middle column: contributions / streak -->
      <text x="330" y="70" font-size="16" fill="#58a6ff">total_contributions</text>
      <text x="330" y="100" font-size="30" fill="#ffffff" font-weight="bold">976</text>
      <text x="330" y="122" font-size="12" fill="#8b949e">Jan 2, 2025 - Present</text>

      <text x="330" y="155" font-size="16" fill="#ffa657">current_streak</text>
      <text x="330" y="185" font-size="30" fill="#ffffff" font-weight="bold">45</text>

      <text x="330" y="220" font-size="13" fill="#8b949e">longest_streak: 45 (Jun 10 - Jul 24)</text>

      <!-- divider -->
      <line x1="580" y1="50" x2="580" y2="220" stroke="#30363d" stroke-width="1"/>

      <!-- right column: languages -->
      <text x="610" y="70" font-size="16" fill="#d2a8ff">top_languages</text>

      <rect x="610" y="85" width="34" height="12" fill="#f1e05a"/>
      <text x="654" y="95" font-size="14">JavaScript — 69.66%</text>

      <rect x="610" y="110" width="34" height="12" fill="#563d7c"/>
      <text x="654" y="120" font-size="14">CSS — 10.41%</text>

      <rect x="610" y="135" width="34" height="12" fill="#e34c26"/>
      <text x="654" y="145" font-size="14">HTML — 10.36%</text>

      <rect x="610" y="160" width="34" height="12" fill="#f34b7d"/>
      <text x="654" y="170" font-size="14">EJS — 6.72%</text>

      <rect x="610" y="185" width="34" height="12" fill="#b07219"/>
      <text x="654" y="195" font-size="14">Java — 2.12%</text>

      <!-- bottom: shipped apps line, matches header banner -->
      <line x1="30" y1="245" x2="870" y2="245" stroke="#30363d" stroke-width="1"/>
      <text x="30" y="275" font-size="15">
        <tspan fill="#58a6ff">akash@sfit</tspan><tspan fill="#8b949e">:~$</tspan> echo $SHIPPED
      </text>
      <text x="30" y="305" font-size="15" fill="#ffa657">6 apps shipped solo — auth, db, cloud &amp; deploy, end to end.</text>
    </g>
  </g>

  <rect x="0.5" y="0.5" width="899" height="329" rx="10" ry="10" fill="none" stroke="#30363d" stroke-width="1"/>
</svg>
