<svg width="1000" height="400" viewBox="0 0 1000 400" xmlns="http://www.w3.org/2000/svg" font-family="'Fira Code','Consolas','Courier New',monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f1117"/>
      <stop offset="55%" stop-color="#12141c"/>
      <stop offset="100%" stop-color="#161320"/>
    </linearGradient>
    <linearGradient id="titlebar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#181a22"/>
      <stop offset="100%" stop-color="#1d1f29"/>
    </linearGradient>
    <linearGradient id="headline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a8c5e0"/>
      <stop offset="100%" stop-color="#c3b3dd"/>
    </linearGradient>
    <linearGradient id="glowStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3d4354" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#3d4354" stop-opacity="0.6"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="18" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <style>
      .prompt { fill: #7dd3fc; font-weight: 600; font-size: 17px; }
      .path   { fill: #94a3b8; font-weight: 600; font-size: 17px; }
      .cmd    { fill: #e6e8eb; font-size: 17px; }
      .out    { fill: #cbd5e1; font-size: 17px; }
      .accent2{ fill: #7fbfa0; font-size: 17px; font-weight: 600; }
      .dim    { fill: #64748b; font-size: 17px; }
      .cursor { fill: #7dd3fc; }
      .badge  { font-size: 12.5px; font-weight: 600; fill: #cbd5e1; }
    </style>
  </defs>

  <!-- Card -->
  <rect x="10" y="10" width="980" height="380" rx="14" fill="url(#bg)" stroke="url(#glowStroke)" stroke-width="1.4" filter="url(#softShadow)"/>

  <!-- Title bar -->
  <path d="M10 24 a14 14 0 0 1 14 -14 h952 a14 14 0 0 1 14 14 v40 h-980 z" fill="url(#titlebar)"/>
  <line x1="10" y1="64" x2="990" y2="64" stroke="#2a2d3a" stroke-width="1"/>

  <!-- Traffic lights -->
  <circle cx="42" cy="44" r="7" fill="#ff5f56"/>
  <circle cx="66" cy="44" r="7" fill="#ffbd2e"/>
  <circle cx="90" cy="44" r="7" fill="#27c93f"/>

  <text x="500" y="49" text-anchor="middle" class="dim" font-size="13" letter-spacing="0.5">akash@sfit — /portfolio — zsh</text>

  <!-- Terminal body -->
  <g transform="translate(40, 100)">

    <!-- whoami -->
    <text y="0"><tspan class="prompt">akash@sfit</tspan><tspan class="dim">:</tspan><tspan class="path">~</tspan><tspan class="dim">$ </tspan><tspan class="cmd">whoami --impact</tspan></text>
    <text y="38" font-size="26" font-weight="700" fill="url(#headline)">Akash Jain · Full-Stack Developer</text>
    <text y="64" class="out" font-size="15">I build products end-to-end — from database to deploy — and ship them solo.</text>

    <!-- stack -->
    <text y="106"><tspan class="prompt">akash@sfit</tspan><tspan class="dim">:</tspan><tspan class="path">~</tspan><tspan class="dim">$ </tspan><tspan class="cmd">cat stack.txt</tspan></text>
    <g transform="translate(0, 122)">
      <!-- stack badges -->
      <g transform="translate(0,0)">
        <rect width="76" height="24" rx="12" fill="#3a4152"/><text x="38" y="16" text-anchor="middle" class="badge">Node.js</text>
      </g>
      <g transform="translate(84,0)">
        <rect width="78" height="24" rx="12" fill="#3a4152"/><text x="39" y="16" text-anchor="middle" class="badge">Express</text>
      </g>
      <g transform="translate(170,0)">
        <rect width="66" height="24" rx="12" fill="#3a4152"/><text x="33" y="16" text-anchor="middle" class="badge">React</text>
      </g>
      <g transform="translate(244,0)">
        <rect width="84" height="24" rx="12" fill="#3a4152"/><text x="42" y="16" text-anchor="middle" class="badge">MongoDB</text>
      </g>
      <g transform="translate(336,0)">
        <rect width="66" height="24" rx="12" fill="#3a4152"/><text x="33" y="16" text-anchor="middle" class="badge">Redis</text>
      </g>
      <g transform="translate(410,0)">
        <rect width="72" height="24" rx="12" fill="#3a4152"/><text x="36" y="16" text-anchor="middle" class="badge">Docker</text>
      </g>
    </g>

    <!-- ship --list -->
    <text y="188"><tspan class="prompt">akash@sfit</tspan><tspan class="dim">:</tspan><tspan class="path">~</tspan><tspan class="dim">$ </tspan><tspan class="cmd">./ship --list</tspan></text>
    <text y="216"><tspan class="accent2">6 apps</tspan><tspan class="out"> shipped solo — auth, db, cloud &amp; deploy, end to end.</tspan></text>

    <!-- cursor line -->
    <text y="258"><tspan class="prompt">akash@sfit</tspan><tspan class="dim">:</tspan><tspan class="path">~</tspan><tspan class="dim">$ </tspan></text>
    <rect x="107" y="245" width="11" height="18" class="cursor">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
