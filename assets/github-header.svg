<svg width="900" height="280" viewBox="0 0 900 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="rounded">
      <rect x="0" y="0" width="900" height="280" rx="10" ry="10"/>
    </clipPath>
  </defs>

  <g clip-path="url(#rounded)">
    <rect width="900" height="280" fill="#0d1117"/>

    <!-- title bar -->
    <rect x="0" y="0" width="900" height="34" fill="#161b22"/>
    <circle cx="20" cy="17" r="6" fill="#ff5f56"/>
    <circle cx="42" cy="17" r="6" fill="#ffbd2e"/>
    <circle cx="64" cy="17" r="6" fill="#27c93f"/>
    <text x="450" y="21" font-family="SFMono-Regular, Consolas, monospace" font-size="12" fill="#8b949e" text-anchor="middle">akash@sfit: ~</text>

    <!-- terminal body -->
    <g font-family="SFMono-Regular, Consolas, monospace" font-size="17" fill="#c9d1d9">

      <text x="24" y="70"><tspan fill="#58a6ff">akash@sfit</tspan><tspan fill="#8b949e">:~$</tspan> whoami</text>

      <text x="24" y="100" fill="#7ee787" opacity="0">
        Akash Jain — Full-Stack Developer
        <animate attributeName="opacity" begin="0.4s" dur="0.3s" fill="freeze" to="1"/>
      </text>

      <text x="24" y="132" opacity="0">
        <tspan fill="#58a6ff">akash@sfit</tspan><tspan fill="#8b949e">:~$</tspan> cat stack.txt
        <animate attributeName="opacity" begin="1.1s" dur="0.3s" fill="freeze" to="1"/>
      </text>

      <text x="24" y="162" fill="#c9d1d9" opacity="0">
        Node.js · Express · React · MongoDB · Redis · Docker
        <animate attributeName="opacity" begin="1.8s" dur="0.3s" fill="freeze" to="1"/>
      </text>

      <text x="24" y="194" opacity="0">
        <tspan fill="#58a6ff">akash@sfit</tspan><tspan fill="#8b949e">:~$</tspan> ./ship --list
        <animate attributeName="opacity" begin="2.5s" dur="0.3s" fill="freeze" to="1"/>
      </text>

      <text x="24" y="224" fill="#ffa657" opacity="0">
        6 apps shipped solo — auth, db, cloud &amp; deploy, end to end.
        <animate attributeName="opacity" begin="3.2s" dur="0.3s" fill="freeze" to="1"/>
      </text>

      <!-- blinking cursor -->
      <rect x="24" y="240" width="10" height="18" fill="#7ee787" opacity="0">
        <animate attributeName="opacity" begin="3.6s" dur="1s" repeatCount="indefinite" values="1;0;1"/>
      </rect>
      <text x="40" y="255" fill="#8b949e" font-size="14" opacity="0">
        <animate attributeName="opacity" begin="3.6s" dur="0.3s" fill="freeze" to="1"/>
      </text>
    </g>
  </g>

  <rect x="0.5" y="0.5" width="899" height="279" rx="10" ry="10" fill="none" stroke="#30363d" stroke-width="1"/>
</svg>
